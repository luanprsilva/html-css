<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em html</title>
</head>
<body>
    <h1>imagens dinâmicas</h1>
    <p>
        tente abrir este site em vários dispositivos ou simplesmente aumente ou dminua o tamanho do seu navegador.
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>

<h1>reproduzindo aúdio</h1>
<p>vamos aprender a reproduzir aúdio em html5.</p>
<audio preload="metadata" autoplay controls>
    <source src="midia/CominWitIt-Anno Domini Beats.mp3" type="audio/mpeg">
    <source src="midia/CominWitIt-Anno Domini Beats.ogg" type="audio/ogg">
    <source src="midia/CominWitIt-Anno Domini Beats.wav" type="audio/wav">
    <p>
        infelizmente o seu navegador não consegue reproduzir audio.
        <a href="midia/CominWitIt-Anno Domini Beats.mp3">cliqeu aqui para baixar o arquivo mp3.</a>
    </p>
</audio>
</body>
</html>

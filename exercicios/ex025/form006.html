<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="icor">cor:</label>
            <input type="color" name="cor" id="icor" value="#ff5544">
        </p>
        <p>
            <label for="inivel">nivel de satisfação:</label>
            <input type="range" name="nivel" id="inivel" value="0">
        </p>
        <p>
            <label for="ifoto">foto do perfil:</label>
            <input type="file" name="foto" id="ifoto">
        </p>
        <p>
            <input type="reset" value="linpar">
            <input type="submit" value="enviar">
        </p>
    </form>
</body>
</html>

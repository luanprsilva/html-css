<!DOCTYPE html>
<html lang="pt-br
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>site de teste</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
        }
        caption{
    font-size: 1.5em;
    font-weight: bold;
    padding: 10px;
}
table{
    width: 100%;
    border-collapse: collapse;
    margin: auto;
}
.tabela{
    overflow-x: auto;
}
 thead > tr > th{
    position: sticky;
    top: -1px;
    background-color: red;
}

th, td{
    border: 1px solid black;
    padding: 10px;
    text-align: center;
}
th{
    background-color: #d9d9d9;
}
tbody tr:nth-child(2n){
            background-color: #f2f2f2;
}
    </style>
</head>
<body>
    <h1>isso é um teste</h1>
            <div class="tabela">
                <table>
                <caption>Principais Equipes da Fórmula 1</caption>
                <thead>
                    <tr>
                        <th>Equipe</th>

                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ferrari</td>

                    </tr>
                    <tr>
                        <td>Mercedes</td>

                    </tr>
                    <tr>
                        <td>Red Bull Racing</td>

                        <td>6</td>
                    </tr>
                    <tr>
                        <td>McLaren</td>

                    </tr>
                    <tr>

                    </tr>
                         </tbody>
                         </table>
            </div>
</body>
</html>

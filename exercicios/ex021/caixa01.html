<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixas</title>
    <style>
        h1{ /*box-level*/
            background-color:purple;
            height: 300px;
            width:300px;
            border-width: 9px ;
            border-style: solid;
            border-color: #3f1c42;

border: 9px solid #3f1c42;

           padding-top: 7px;
           padding-right: 10px ;
           padding-bottom: 10px ;
           padding-left: 10px ;

padding:7px 10px 10px 10px ;

           margin-top: 20px; 
           margin-right: 20px;
           margin-bottom: 40px;
           margin-left:20px ;
           
    margin: 20px auto 40px auto;

    outline:5px dashed #fa8072 ;
        }
        a{/*inline-level*/
         

        border:10px solid #d87093;
            
            padding:-7px ;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>parágrafos tambem são exemplos de box-level, mas os <a href="#">links são exemplos de inline-level</a>vamos ver como tudo isso funciona.</p>
</body>
</html>

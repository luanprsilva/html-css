<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }
        thead, tfoot{
            background-color: gray;
            color: white;
        }
        thead > tr > th{
            position: sticky;
            top: -1px;
            background-color: gray;
        }
        td, th{
            padding: 10px;
            border: 1px solid black;
        }
        .num{
            text-align: right;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
            padding: 1px;
        }
        tbody > tr:nth-child(2n){
            background-color: lightgray;
        }
        .dadospp{
            width: 100px;
        }
    </style>

    
</head>
<body>
    <h1>uso de tabelas grandes</h1>
    <table>
        <caption>população das unidades federativas</caption>
        <thead>
            <th scope="col">estado</th>
            <th scope="col" class="dadospp">população</th>
        </thead>
        <tbody>
<tr>
    <td>São Paulo</td>
    <td class="num">45.919.049</td>
 </tr>
<tr>
    <td>Minas Gerais</td>
    <td class="num">21.168.791</td>
 </tr>
  <tr>
    <td>Rio de Janeiro</td>
    <td class="num">17.264.943</td>
</tr>
        </tbody>
        <tfoot>
 <tr>
   <th scope="row">total de habitantes</th>
   <td class="num">000000</td>

        </tfoot>
    </table>
</body>
</html>
